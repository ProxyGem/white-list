<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Подписка</title>
</head>
<body>
<script>
(async () => {
  const url = 'https://raw.githubusercontent.com/ProxyGem/X3-qW8-zR5-/main/white_list.txt';
  try {
    const r = await fetch(url);
    const text = await r.text();
    
    // Оставляем только vless:// и hysteria2://
    const lines = text.split('\n').filter(l => {
      const t = l.trim();
      return t.startsWith('vless://') || t.startsWith('hysteria2://');
    });
    
    const joined = lines.join('\n');
    
    // Кодируем в Base64 (UTF-8 safe)
    const base64 = btoa(unescape(encodeURIComponent(joined)));
    
    // Заменяем страницу на чистый Base64-текст
    document.documentElement.innerHTML = '<pre style="word-wrap:break-word;white-space:pre-wrap;font-family:monospace;font-size:12px;padding:10px;">' + base64 + '</pre>';
  } catch (e) {
    document.body.innerHTML = 'Ошибка: ' + e.message;
  }
})();
</script>
</body>
</html>
